name: memecoin-copytrader

x-backend-env: &backend-env
  DATABASE_URL: postgresql+asyncpg://copytrader:${POSTGRES_PASSWORD:-copytrader}@db:5432/copytrader
  REDIS_URL: redis://redis:6379/0
  SOLANA_RPC_URL: ${SOLANA_RPC_URL:-https://api.mainnet-beta.solana.com}
  SOLANA_WS_URL: ${SOLANA_WS_URL:-wss://api.mainnet-beta.solana.com}
  LOG_LEVEL: ${LOG_LEVEL:-INFO}

x-backend-service: &backend-service
  build: ./backend
  restart: unless-stopped
  depends_on:
    db:
      condition: service_healthy
    redis:
      condition: service_healthy
    migrate:
      condition: service_completed_successfully

services:
  db:
    image: timescale/timescaledb:latest-pg16
    restart: unless-stopped
    environment:
      POSTGRES_USER: copytrader
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-copytrader}
      POSTGRES_DB: copytrader
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U copytrader -d copytrader"]
      interval: 5s
      timeout: 5s
      retries: 12
    ports:
      - "127.0.0.1:5432:5432"

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--maxmemory", "1gb", "--maxmemory-policy", "noeviction"]
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 12
    ports:
      - "127.0.0.1:6379:6379"

  migrate:
    build: ./backend
    environment: *backend-env
    command: ["alembic", "upgrade", "head"]
    depends_on:
      db:
        condition: service_healthy
    restart: "no"

  api:
    <<: *backend-service
    environment:
      <<: *backend-env
      ML_MODEL_DIR: /srv/backend/models
      JWT_SECRET: "${JWT_SECRET:-dev-insecure-change-me}"
      ADMIN_USERNAME: "${ADMIN_USERNAME:-admin}"
      ADMIN_PASSWORD_HASH: "${ADMIN_PASSWORD_HASH:-}"
    ports:
      - "8000:8000"
    volumes:
      # Read side of the model registry: artifact paths stored by the
      # analytics trainer must resolve here too, or predictions can never
      # be served outside the analytics container.
      - mlmodels:/srv/backend/models

  listener:
    <<: *backend-service
    environment:
      <<: *backend-env
      METRICS_PORT: "9101"
    command: ["python", "-m", "workers.run_listener"]

  ingest-writer:
    <<: *backend-service
    environment:
      <<: *backend-env
      METRICS_PORT: "9102"
    command: ["python", "-m", "workers.run_ingest_writer"]

  enrichment:
    <<: *backend-service
    environment:
      <<: *backend-env
      METRICS_PORT: "9103"
    command: ["python", "-m", "workers.run_enrichment"]

  analytics:
    <<: *backend-service
    environment:
      <<: *backend-env
      METRICS_PORT: "9104"
      ML_MODEL_DIR: /srv/backend/models
    command: ["python", "-m", "workers.run_analytics"]
    volumes:
      - mlmodels:/srv/backend/models

  evaluation:
    <<: *backend-service
    environment:
      <<: *backend-env
      METRICS_PORT: "9106"
    command: ["python", "-m", "workers.run_evaluation"]

  copytrader:
    <<: *backend-service
    environment:
      <<: *backend-env
      METRICS_PORT: "9105"
      ML_MODEL_DIR: /srv/backend/models
      # Copy trading is OFF by default. Even enabled, COPY_MODE defaults to
      # paper; live requires COPY_MODE=live plus TRADING_WALLET_SECRET.
      COPY_ENABLED: "${COPY_ENABLED:-false}"
      COPY_MODE: "${COPY_MODE:-paper}"
      TRADING_WALLET_SECRET: "${TRADING_WALLET_SECRET:-}"
      ADMIN_TOKEN: "${ADMIN_TOKEN:-}"
    command: ["python", "-m", "workers.run_copytrader"]
    volumes:
      - mlmodels:/srv/backend/models

  telegram:
    <<: *backend-service
    environment:
      <<: *backend-env
      METRICS_PORT: "9107"
      # Bot idles harmlessly when the token is unset.
      TELEGRAM_BOT_TOKEN: "${TELEGRAM_BOT_TOKEN:-}"
      TELEGRAM_CHAT_ID: "${TELEGRAM_CHAT_ID:-}"
    command: ["python", "-m", "workers.run_telegram"]

  frontend:
    build:
      context: ./frontend
      args:
        # Baked into the client JS bundle at build time (Next.js inlines
        # NEXT_PUBLIC_* vars during `npm run build`) — a runtime-only
        # override here has no effect, the image must be rebuilt when this
        # changes. Browser talks to the API on the host; override for your
        # deployment (e.g. http://YOUR_DROPLET_IP:8000).
        NEXT_PUBLIC_API_BASE: "${NEXT_PUBLIC_API_BASE:-http://localhost:8000}"
    restart: unless-stopped
    ports:
      - "3000:3000"
    depends_on:
      - api

volumes:
  pgdata:
  redisdata:
  mlmodels:
