name: memecoin-copytrader

x-backend-env: &backend-env
  DATABASE_URL: postgresql+asyncpg://copytrader:${POSTGRES_PASSWORD:-copytrader}@db:5432/copytrader
  REDIS_URL: redis://redis:6379/0
  SOLANA_RPC_URL: ${SOLANA_RPC_URL:-https://api.mainnet-beta.solana.com}
  SOLANA_WS_URL: ${SOLANA_WS_URL:-wss://api.mainnet-beta.solana.com}
  RPC_REQUESTS_PER_SECOND: ${RPC_REQUESTS_PER_SECOND:-8}
  RPC_DAILY_CREDIT_BUDGET: ${RPC_DAILY_CREDIT_BUDGET:-0}
  # Ingest buffer cap: the stream auto-drops OLDEST entries past this size,
  # so a budget-limited writer always works the freshest slice of the
  # firehose instead of falling permanently behind a FIFO backlog. Size it
  # to ~30-60s of inflow for real-time copy trading.
  INGEST_STREAM_MAXLEN: ${INGEST_STREAM_MAXLEN:-1000000}
  ENABLED_DEXES: ${ENABLED_DEXES:-["pumpfun","pumpswap","raydium_amm","raydium_clmm","raydium_cpmm","orca_whirlpool","jupiter"]}
  VETTING_ENABLED: ${VETTING_ENABLED:-true}
  VETTING_BLOCK_SUSPICIOUS: ${VETTING_BLOCK_SUSPICIOUS:-true}
  RUG_CHECK_ENABLED: ${RUG_CHECK_ENABLED:-true}
  RUG_MAX_SCORE: ${RUG_MAX_SCORE:-60}
  RUG_FAIL_CLOSED: ${RUG_FAIL_CLOSED:-true}
  # Every service that can REPORT status (telegram, api) or GATE on these
  # must see the same values as the copytrader worker that acts on them —
  # otherwise /status and the dashboard silently show stale defaults
  # regardless of what .env actually says.
  COPY_ENABLED: ${COPY_ENABLED:-false}
  COPY_MODE: ${COPY_MODE:-paper}
  # Copy tuning knobs (defaults mirror backend/app/config.py). Documented in
  # .env.example but previously never passed through, so operator overrides
  # were silently ignored.
  COPY_AUTO_FOLLOW: ${COPY_AUTO_FOLLOW:-true}
  COPY_MIN_WALLET_CONFIDENCE: ${COPY_MIN_WALLET_CONFIDENCE:-65}
  COPY_MIN_CONFIDENCE: ${COPY_MIN_CONFIDENCE:-60}
  COPY_MAX_RISK: ${COPY_MAX_RISK:-70}
  COPY_MIN_LIQUIDITY_SOL: ${COPY_MIN_LIQUIDITY_SOL:-25}
  COPY_MIN_MARKET_CAP_USD: ${COPY_MIN_MARKET_CAP_USD:-10000}
  COPY_MAX_MARKET_CAP_USD: ${COPY_MAX_MARKET_CAP_USD:-50000000}
  COPY_REQUIRE_MARKET_CAP: ${COPY_REQUIRE_MARKET_CAP:-false}
  COPY_SIZE_MODE: ${COPY_SIZE_MODE:-fixed}
  COPY_FIXED_SOL: ${COPY_FIXED_SOL:-0.05}
  COPY_PERCENT_OF_LEADER: ${COPY_PERCENT_OF_LEADER:-2.0}
  COPY_MAX_POSITION_SOL: ${COPY_MAX_POSITION_SOL:-0.5}
  COPY_MAX_OPEN_POSITIONS: ${COPY_MAX_OPEN_POSITIONS:-10}
  COPY_MAX_EXPOSURE_SOL: ${COPY_MAX_EXPOSURE_SOL:-2.0}
  COPY_DAILY_LOSS_LIMIT_SOL: ${COPY_DAILY_LOSS_LIMIT_SOL:-1.0}
  COPY_SLIPPAGE_BPS: ${COPY_SLIPPAGE_BPS:-300}
  COPY_TOKEN_COOLDOWN_SECONDS: ${COPY_TOKEN_COOLDOWN_SECONDS:-900}
  COPY_APPROVAL_MODE: ${COPY_APPROVAL_MODE:-false}
  LOG_LEVEL: ${LOG_LEVEL:-INFO}

x-backend-service: &backend-service
  build: ./backend
  restart: unless-stopped
  depends_on:
    db:
      condition: service_healthy
    redis:
      condition: service_healthy
    migrate:
      condition: service_completed_successfully

services:
  db:
    image: timescale/timescaledb:latest-pg16
    restart: unless-stopped
    environment:
      POSTGRES_USER: copytrader
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-copytrader}
      POSTGRES_DB: copytrader
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U copytrader -d copytrader"]
      interval: 5s
      timeout: 5s
      retries: 12
    ports:
      - "127.0.0.1:5432:5432"

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--maxmemory", "1gb", "--maxmemory-policy", "noeviction"]
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 12
    ports:
      - "127.0.0.1:6379:6379"

  migrate:
    build: ./backend
    environment: *backend-env
    command: ["alembic", "upgrade", "head"]
    depends_on:
      db:
        condition: service_healthy
    restart: "no"

  api:
    <<: *backend-service
    environment:
      <<: *backend-env
      ML_MODEL_DIR: /srv/backend/models
      JWT_SECRET: "${JWT_SECRET:-dev-insecure-change-me}"
      ADMIN_USERNAME: "${ADMIN_USERNAME:-admin}"
      ADMIN_PASSWORD_HASH: "${ADMIN_PASSWORD_HASH:-}"
    ports:
      - "8000:8000"
    volumes:
      # Read side of the model registry: artifact paths stored by the
      # analytics trainer must resolve here too, or predictions can never
      # be served outside the analytics container.
      - mlmodels:/srv/backend/models

  listener:
    <<: *backend-service
    environment:
      <<: *backend-env
      METRICS_PORT: "9101"
    command: ["python", "-m", "workers.run_listener"]

  ingest-writer:
    <<: *backend-service
    environment:
      <<: *backend-env
      METRICS_PORT: "9102"
    command: ["python", "-m", "workers.run_ingest_writer"]

  enrichment:
    <<: *backend-service
    environment:
      <<: *backend-env
      METRICS_PORT: "9103"
    command: ["python", "-m", "workers.run_enrichment"]

  analytics:
    <<: *backend-service
    environment:
      <<: *backend-env
      METRICS_PORT: "9104"
      ML_MODEL_DIR: /srv/backend/models
    command: ["python", "-m", "workers.run_analytics"]
    volumes:
      - mlmodels:/srv/backend/models

  evaluation:
    <<: *backend-service
    environment:
      <<: *backend-env
      METRICS_PORT: "9106"
    command: ["python", "-m", "workers.run_evaluation"]

  copytrader:
    <<: *backend-service
    environment:
      <<: *backend-env
      METRICS_PORT: "9105"
      ML_MODEL_DIR: /srv/backend/models
      # COPY_ENABLED/COPY_MODE come from the shared anchor now (every
      # status-reporting service needs them, not just this one). Live
      # trading additionally requires COPY_MODE=live plus this secret.
      TRADING_WALLET_SECRET: "${TRADING_WALLET_SECRET:-}"
      ADMIN_TOKEN: "${ADMIN_TOKEN:-}"
    command: ["python", "-m", "workers.run_copytrader"]
    volumes:
      - mlmodels:/srv/backend/models

  telegram:
    <<: *backend-service
    environment:
      <<: *backend-env
      METRICS_PORT: "9107"
      # Bot idles harmlessly when the token is unset.
      TELEGRAM_BOT_TOKEN: "${TELEGRAM_BOT_TOKEN:-}"
      TELEGRAM_CHAT_ID: "${TELEGRAM_CHAT_ID:-}"
    command: ["python", "-m", "workers.run_telegram"]

  frontend:
    build:
      context: ./frontend
      args:
        # Baked into the client JS bundle at build time (Next.js inlines
        # NEXT_PUBLIC_* vars during `npm run build`) — a runtime-only
        # override here has no effect, the image must be rebuilt when this
        # changes. Browser talks to the API on the host; override for your
        # deployment (e.g. http://YOUR_DROPLET_IP:8000).
        NEXT_PUBLIC_API_BASE: "${NEXT_PUBLIC_API_BASE:-http://localhost:8000}"
    restart: unless-stopped
    ports:
      - "3000:3000"
    depends_on:
      - api

volumes:
  pgdata:
  redisdata:
  mlmodels:
