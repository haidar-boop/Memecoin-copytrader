name: scan

# Free automated bug + security scanning. Runs on every push and pull
# request. Steps split into two groups:
#   - BLOCKING (turn the run red): the linter and the test suite. These are
#     reliable signals that something is actually broken.
#   - INFORMATIONAL (never block, but printed in the logs): type checks,
#     security scanners, dependency audits. These are noisier by nature, so
#     they report findings without failing the build — read them, don't fear
#     them. Dependabot (see .github/dependabot.yml) handles vulnerable
#     dependencies with its own PRs.

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch: {}

jobs:
  backend:
    name: Backend (Python)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install backend + scanners
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
          pip install mypy bandit pip-audit

      # --- BLOCKING ------------------------------------------------------
      - name: Ruff (lint / bug patterns)
        run: ruff check .

      - name: Pytest (test suite)
        run: pytest -q

      # --- INFORMATIONAL (never blocks) ----------------------------------
      - name: Mypy (type checks)
        continue-on-error: true
        run: mypy app workers telegram_bot --ignore-missing-imports --no-error-summary || true

      - name: Bandit (security patterns)
        continue-on-error: true
        run: bandit -r app workers telegram_bot -ll || true

      - name: pip-audit (vulnerable dependencies)
        continue-on-error: true
        run: pip-audit || true

  frontend:
    name: Frontend (Next.js)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install
        run: npm ci

      # --- BLOCKING ------------------------------------------------------
      - name: TypeScript type check
        run: npm run typecheck

      # --- INFORMATIONAL (never blocks) ----------------------------------
      - name: ESLint
        continue-on-error: true
        run: npm run lint || true

      - name: npm audit (vulnerable dependencies)
        continue-on-error: true
        run: npm audit || true
